<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Institution overview | NeuroGPT</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell">
    <a class="back-link" href="{{ url_for('home') }}">← Home</a>
    <header class="page-header"><div><p class="eyebrow">Institution</p><h1>Resident overview</h1></div></header>
    <section class="empty-state">
      <h2>{{ resident.name }} · {{ resident.room }}</h2>
      <p>{{ resident.institution_name }}{% if latest_event %} · Latest update received{% else %} · No activity yet{% endif %}</p>
    </section>
  </main>
</body>
</html>
